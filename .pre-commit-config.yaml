repos:
  - repo: https://github.com/psf/black
    rev: 23.7.0
    hooks:
      - id: black
        args: ["--line-length", "100"]

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: "stable"
    hooks:
      - id: ruff
        args: ["--fix", "--max-line-length=100"]

  - repo: https://github.com/pre-commit/mirrors-isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--profile", "black"]
